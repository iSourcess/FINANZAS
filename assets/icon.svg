<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2E1200" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </radialGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A45" />
      <stop offset="50%" stop-color="#FF7A1A" />
      <stop offset="100%" stop-color="#C45200" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Negro Profundo con Borde Redondeado -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2A2A2A" stroke-width="4" opacity="0.6" />

  <!-- Símbolo: Tarjeta / Billetera Geométrica con Acento Naranja -->
  <g transform="translate(106, 126)" filter="url(#glow)">
    <!-- Tarjeta Trasera -->
    <rect x="0" y="0" width="300" height="190" rx="24" fill="#1A1A1A" stroke="#383838" stroke-width="6" />
    <circle cx="56" cy="56" r="20" fill="#FF7A1A" opacity="0.4" />

    <!-- Tarjeta Frontal Desplazada -->
    <rect x="24" y="44" width="276" height="186" rx="24" fill="url(#orangeGrad)" />
    
    <!-- Banda Magnética / Chip Estilizado -->
    <rect x="24" y="80" width="276" height="34" fill="#0A0A0A" opacity="0.25" />
    <circle cx="76" cy="170" r="14" fill="#FFFFFF" opacity="0.9" />
    <circle cx="106" cy="170" r="14" fill="#FFE0C0" opacity="0.75" />

    <!-- Flecha Dinámica de Crecimiento / Finanzas -->
    <path d="M210 176 L254 132 M254 132 L226 132 M254 132 L254 160" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
