<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <radialGradient id="splashGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E1200" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </radialGradient>
    <linearGradient id="splashOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A45" />
      <stop offset="50%" stop-color="#FF7A1A" />
      <stop offset="100%" stop-color="#C45200" />
    </linearGradient>
  </defs>

  <!-- Fondo Negro Profundo -->
  <rect width="1080" height="1920" fill="#0A0A0A" />
  <circle cx="540" cy="920" r="450" fill="url(#splashGlow)" opacity="0.6" />

  <!-- Logo Central -->
  <g transform="translate(390, 770)">
    <!-- Tarjeta Trasera -->
    <rect x="0" y="0" width="260" height="165" rx="22" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="5" />

    <!-- Tarjeta Frontal -->
    <rect x="30" y="40" width="250" height="165" rx="22" fill="url(#splashOrange)" />
    <rect x="30" y="75" width="250" height="30" fill="#0A0A0A" opacity="0.25" />
    <circle cx="75" cy="155" r="12" fill="#FFFFFF" opacity="0.9" />
    <circle cx="102" cy="155" r="12" fill="#FFE0C0" opacity="0.75" />
    <path d="M195 160 L235 120 M235 120 L210 120 M235 120 L235 145" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tipografía Finanzas -->
  <text x="540" y="1070" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="700" fill="#F5F5F5" letter-spacing="2">
    FINANZAS
  </text>
  <text x="540" y="1110" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="18" font-weight="500" fill="#A3A3A3" letter-spacing="1">
    Tus datos en tu dispositivo
  </text>
</svg>
